services:
  - type: web
    name: caflow-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DOCUMENT_INTELLIGENCE_PROVIDER
        value: mock
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ENABLE_SCHEDULER
        value: "true"
      # Reporting passbook: serve accrual Trial Balance / P&L / Balance Sheet from
      # the pre-aggregated account_period_balances cache (one small read) instead
      # of replaying the whole posted ledger. "on" serves the fast path with an
      # automatic fall-back to the legacy full-history engine on any error. Buckets
      # are backfilled + trigger-maintained and verified paise-identical to raw.
      # Quoted so YAML doesn't parse the bareword `on` as a boolean.
      - key: REPORTING_PASSBOOK_MODE
        value: "on"
