[tool.ruff]
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["F", "B", "E722", "C901", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"routers/**" = ["B008"]
"tests/**" = ["C901", "PLR0915"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header", "fastapi.Path",
    "fastapi.Form", "fastapi.File", "fastapi.Cookie", "fastapi.Security",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-statements = 75
