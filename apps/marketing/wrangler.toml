# Cloudflare Pages project for the PracticeSync marketing site.
# This is a SEPARATE project from apps/web (practicesync-ai). Today both run on
# *.pages.dev; once a custom domain is attached, point the apex (yourdomain) at
# this project and app.yourdomain at the apps/web project.
name = "practicesync"
compatibility_date = "2024-09-23"
pages_build_output_dir = "out"

[vars]
# Origin of the actual application (apps/web). Currently its Cloudflare Pages URL;
# change to https://app.<yourdomain> once a custom domain is attached.
NEXT_PUBLIC_APP_URL = "https://practicesync-ai.pages.dev"
