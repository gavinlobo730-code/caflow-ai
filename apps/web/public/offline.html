<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0D1635">
<title>Can't reach PracticeSync</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
         background: #0D1635; color: #F1F5F9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 26rem; text-align: center; }
  h1 { margin: 0 0 12px; font-size: 1.5rem; font-weight: 600; }
  p { margin: 0 0 12px; font-size: 1rem; line-height: 1.5; color: #CBD5E1; }
  button { margin-top: 12px; padding: 12px 24px; border: 0; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer;
           background: #38BDF8; color: #0D1635; }
  button:focus-visible { outline: 3px solid #F1F5F9; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <!-- inline, so the page needs nothing from the network: the worker stores this one file and nothing else for it -->
  <svg width="72" height="72" viewBox="0 0 200 200" fill="none" role="img" aria-label="PracticeSync" style="margin-bottom:20px"><rect width="200" height="200" rx="40" fill="#0F172A"/><rect x="66" y="81" width="92" height="62" rx="10" fill="#1E3A5F"/><rect x="54" y="69" width="92" height="62" rx="10" fill="#2563EB"/><rect x="42" y="57" width="92" height="62" rx="10" fill="#38BDF8"/></svg>
  <h1>Can't reach PracticeSync</h1>
  <p>Your device may be offline, or the connection was lost. PracticeSync shows figures it has just read from the server, so it cannot open this page without one.</p>
  <p>Check your connection, then try again.</p>
  <button type="button" id="retry">Try again</button>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () { window.location.reload(); });
</script>
</body>
</html>
