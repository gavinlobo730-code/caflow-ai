<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1635"/><stop offset="100%" stop-color="#142256"/>
    </linearGradient>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#bg)"/>
  <!--
    Three nested rotated squares (diamonds) offset to bottom-right
    Suggests depth, precision, layered data — enterprise grade
  -->
  <!-- Back diamond (largest, darkest, offset bottom-right) -->
  <rect x="74" y="74" width="66" height="66" rx="10"
        fill="#0f2352" stroke="#2563EB" stroke-opacity="0.3" stroke-width="1.5"
        transform="rotate(45 107 107)"/>
  <!-- Mid diamond -->
  <rect x="64" y="64" width="58" height="58" rx="9"
        fill="#1a3a7c"
        transform="rotate(45 93 93)"/>
  <!-- Front diamond (smallest, brightest, top-left) -->
  <rect x="58" y="58" width="50" height="50" rx="8"
        fill="url(#dg)"
        transform="rotate(45 83 83)"/>
  <!-- Center dot -->
  <circle cx="100" cy="100" r="6" fill="white" fill-opacity="0.8"/>
</svg>
