<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1635"/><stop offset="100%" stop-color="#142256"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#bg)"/>
  <!--
    Three bold gradient bars — like an equalizer / hierarchy
    Full → partial → minimal. Works perfectly at 16px favicon.
    Represents layered operations unified into one platform.
  -->
  <!-- Top bar — widest, brightest (teal-blue) -->
  <rect x="42" y="60" width="116" height="22" rx="11" fill="url(#g1)"/>
  <!-- Mid bar — medium width, blue -->
  <rect x="42" y="92" width="88" height="22" rx="11" fill="url(#g2)"/>
  <!-- Bottom bar — narrowest, navy-blue -->
  <rect x="42" y="124" width="60" height="22" rx="11" fill="url(#g3)"/>
  <!-- Right-side trailing dots (suggest continuation/more data) -->
  <circle cx="166" cy="103" r="3.5" fill="#2563EB" fill-opacity="0.5"/>
  <circle cx="160" cy="135" r="3.5" fill="#1a3a7c" fill-opacity="0.7"/>
</svg>
