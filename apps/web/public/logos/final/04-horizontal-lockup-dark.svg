<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <!-- Dark background -->
  <rect width="520" height="120" rx="16" fill="#0F172A"/>

  <!-- Icon: three stacked panels, centered vertically in 120px height -->
  <!-- Panel size: 56x38, offset 7px each, total: 70x52, centered at (50,60) -->
  <!-- Back: x=29, y=34  Mid: x=22, y=27  Front: x=15, y=20 -->
  <rect x="29" y="34" width="56" height="38" rx="6" fill="#1E3A5F"/>
  <rect x="22" y="27" width="56" height="38" rx="6" fill="#2563EB"/>
  <rect x="15" y="20" width="56" height="38" rx="6" fill="#38BDF8"/>

  <!-- Wordmark: "PracticeSync" -->
  <text x="98" y="68" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="600" letter-spacing="-0.5" fill="white">PracticeSync</text>
</svg>
