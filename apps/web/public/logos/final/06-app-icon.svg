<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- App store rounded square background -->
  <rect width="1024" height="1024" rx="230" fill="#0F172A"/>

  <!-- Three stacked panels, centered in 1024x1024 -->
  <!-- Panel size: 472x318, offset 62px each -->
  <!-- Back:  x=338, y=415  Mid: x=276, y=353  Front: x=214, y=291 -->
  <rect x="338" y="415" width="472" height="318" rx="52" fill="#1E3A5F"/>
  <rect x="276" y="353" width="472" height="318" rx="52" fill="#2563EB"/>
  <rect x="214" y="291" width="472" height="318" rx="52" fill="#38BDF8"/>
</svg>
