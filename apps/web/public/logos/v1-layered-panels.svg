<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1635"/><stop offset="100%" stop-color="#142256"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#bg)"/>
  <!-- Back panel -->
  <rect x="78" y="86" width="76" height="54" rx="9" fill="#0f2a5c"/>
  <!-- Mid panel -->
  <rect x="69" y="77" width="76" height="54" rx="9" fill="#1a40a0"/>
  <!-- Front panel -->
  <rect x="60" y="68" width="76" height="54" rx="9" fill="#2563EB"/>
  <!-- Front panel detail: title bar -->
  <rect x="60" y="68" width="76" height="14" rx="9" fill="#1d4ed8"/>
  <rect x="60" y="76" width="76" height="6" fill="#1d4ed8"/>
