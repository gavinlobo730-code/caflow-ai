  <circle cx="73" cy="75" r="3" fill="#60A5FA" fill-opacity="0.7"/>
  <circle cx="83" cy="75" r="3" fill="#38BDF8" fill-opacity="0.9"/>
  <!-- Content lines -->
  <line x1="74" y1="94" x2="120" y2="94" stroke="white" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="74" y1="103" x2="110" y2="103" stroke="white" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>
  <line x1="74" y1="112" x2="116" y2="112" stroke="white" stroke-opacity="0.15" stroke-width="2" stroke-linecap="round"/>
</svg>
