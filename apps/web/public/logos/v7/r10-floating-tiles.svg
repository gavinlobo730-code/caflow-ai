<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#0EA5E9"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0EA5E9"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="#0B1635"/>
  <!-- 4 tiles floating — their collective shape IS the logo -->
  <rect x="38" y="38" width="58" height="52" rx="12" fill="url(#t1)"/>
  <rect x="104" y="38" width="58" height="52" rx="12" fill="#1a3a7c"/>
  <rect x="38" y="100" width="58" height="62" rx="12" fill="#1a3a7c"/>
  <rect x="104" y="100" width="58" height="62" rx="12" fill="url(#t2)" fill-opacity="0.7"/>
  <!-- Small gap between tiles acts as grid lines -->
</svg>
