<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060f2e"/><stop offset="100%" stop-color="#0e2a6e"/>
    </linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="pa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.9"/><stop offset="100%" stop-color="#06B6D4" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>
  <!-- Inner subtle border -->
  <rect x="2" y="2" width="196" height="196" rx="42" stroke="white" stroke-opacity="0.05" stroke-width="1.5" fill="none"/>
  <!-- Frame -->
  <rect x="32" y="32" width="136" height="136" rx="20" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <!-- Glowing header -->
  <rect x="32" y="32" width="136" height="32" rx="20" fill="url(#hd)" filter="url(#glow)"/>
  <rect x="32" y="52" width="136" height="12" fill="url(#hd)"/>
  <!-- Dots in header -->
  <circle cx="52" cy="48" r="4.5" fill="white" fill-opacity="0.85"/>
  <circle cx="66" cy="48" r="4.5" fill="white" fill-opacity="0.5"/>
  <circle cx="80" cy="48" r="4.5" fill="white" fill-opacity="0.25"/>
  <!-- Accent panel (top-left) -->
  <rect x="42" y="76" width="54" height="44" rx="10" fill="url(#pa)" filter="url(#glow)"/>
  <!-- Other panels -->
  <rect x="104" y="76" width="52" height="44" rx="10" fill="white" fill-opacity="0.07"/>
  <rect x="42" y="128" width="54" height="30" rx="9" fill="white" fill-opacity="0.07"/>
  <rect x="104" y="128" width="52" height="30" rx="9" fill="white" fill-opacity="0.07"/>
  <!-- Panel details -->
  <line x1="54" y1="92" x2="84" y2="92" stroke="white" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="102" x2="74" y2="102" stroke="white" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
</svg>
