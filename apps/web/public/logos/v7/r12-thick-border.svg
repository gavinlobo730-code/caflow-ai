<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="#0B1635"/>
  <!-- Thick gradient border frame -->
  <rect x="30" y="30" width="140" height="140" rx="22" fill="none" stroke="url(#b)" stroke-width="7"/>
  <!-- Header fill -->
  <rect x="34" y="34" width="132" height="30" rx="18" fill="#1a3a7c"/>
  <rect x="34" y="52" width="132" height="12" fill="#1a3a7c"/>
  <!-- Inner: just 2 accent rectangles -->
  <rect x="44" y="78" width="52" height="78" rx="10" fill="#2563EB" fill-opacity="0.25"/>
  <rect x="104" y="78" width="52" height="78" rx="10" fill="#0EA5E9" fill-opacity="0.15"/>
  <!-- Vertical divider -->
  <line x1="100" y1="72" x2="100" y2="162" stroke="#2563EB" stroke-opacity="0.2" stroke-width="1.5"/>
</svg>
