<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="#0B1635"/>
  <rect x="34" y="34" width="132" height="132" rx="18" fill="#0d1e48"/>
  <!-- Bold header — takes 45% of height -->
  <rect x="34" y="34" width="132" height="60" rx="18" fill="url(#hd)"/>
  <rect x="34" y="78" width="132" height="16" fill="url(#hd)"/>
  <!-- Teal accent bar in header -->
  <rect x="46" y="54" width="44" height="8" rx="4" fill="url(#ac)"/>
  <rect x="46" y="68" width="28" height="6" rx="3" fill="white" fill-opacity="0.2"/>
  <!-- 2 bottom panels -->
  <rect x="46" y="104" width="50" height="52" rx="10" fill="#1a3a7c"/>
  <rect x="106" y="104" width="50" height="52" rx="10" fill="#1a3a7c"/>
</svg>
