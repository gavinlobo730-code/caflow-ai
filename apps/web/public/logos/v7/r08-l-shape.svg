  <!-- Fix left edge clip -->
  <rect x="34" y="62" width="8" height="104" fill="url(#l)" fill-opacity="0.6"/>
  <!-- Right panels -->
  <rect x="106" y="74" width="50" height="40" rx="8" fill="#1a3a7c"/>
  <rect x="106" y="122" width="50" height="38" rx="8" fill="#1a3a7c"/>
