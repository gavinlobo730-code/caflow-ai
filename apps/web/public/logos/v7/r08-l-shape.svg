<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#0EA5E9"/></linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="#0B1635"/>
  <rect x="34" y="34" width="132" height="132" rx="18" fill="#0d1e48"/>
