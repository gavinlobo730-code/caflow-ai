<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1635"/><stop offset="100%" stop-color="#142256"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#bg)"/>
  <!-- Outer workspace frame -->
  <rect x="32" y="32" width="136" height="136" rx="18" fill="#0d1e48" stroke="#2563EB" stroke-opacity="0.18" stroke-width="1.5"/>
  <!-- Top bar (app header) -->
  <rect x="32" y="32" width="136" height="28" rx="18" fill="#1a3a7c"/>
  <rect x="32" y="48" width="136" height="12" fill="#1a3a7c"/>
  <!-- Header dots -->
  <circle cx="51" cy="46" r="4.5" fill="#2563EB"/>
  <circle cx="65" cy="46" r="4.5" fill="#0EA5E9"/>
  <circle cx="79" cy="46" r="4.5" fill="#22D3EE"/>
  <!-- 2x2 content panels -->
  <rect x="44" y="72" width="52" height="40" rx="8" fill="url(#hl)" fill-opacity="0.9"/>
  <rect x="104" y="72" width="52" height="40" rx="8" fill="#1a3a7c"/>
  <rect x="44" y="120" width="52" height="36" rx="8" fill="#1a3a7c"/>
  <rect x="104" y="120" width="52" height="36" rx="8" fill="#1a3a7c"/>
  <!-- Detail line in highlight panel -->
  <line x1="54" y1="87" x2="86" y2="87" stroke="white" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="96" x2="78" y2="96" stroke="white" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>
</svg>
