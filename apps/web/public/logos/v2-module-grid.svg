<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1635"/><stop offset="100%" stop-color="#142256"/>
    </linearGradient>
    <linearGradient id="tl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#bg)"/>
  <!-- Connector lines -->
  <line x1="100" y1="68" x2="100" y2="132" stroke="#2563EB" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="68" y1="100" x2="132" y2="100" stroke="#2563EB" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="68" y1="68" x2="132" y2="68" stroke="#2563EB" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="68" y1="132" x2="132" y2="132" stroke="#2563EB" stroke-opacity="0.15" stroke-width="1"/>
  <!-- 2x2 modules -->
  <rect x="48" y="48" width="42" height="42" rx="9" fill="url(#tl)"/>
  <rect x="110" y="48" width="42" height="42" rx="9" fill="#1a3a7c"/>
  <rect x="48" y="110" width="42" height="42" rx="9" fill="#1a3a7c"/>
  <rect x="110" y="110" width="42" height="42" rx="9" fill="#0EA5E9" fill-opacity="0.5"/>
  <!-- Module details -->
  <line x1="60" y1="66" x2="78" y2="66" stroke="white" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="73" x2="72" y2="73" stroke="white" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center junction dot -->
  <circle cx="100" cy="100" r="5" fill="#22D3EE"/>
</svg>
