<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep navy background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0B1635"/>
      <stop offset="100%" stop-color="#142256"/>
    </linearGradient>

    <!-- Electric blue → cyan gradient for the S -->
    <linearGradient id="sg" x1="90" y1="44" x2="168" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Soft glow on the S letterform -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ── Background tile ── -->
  <rect width="200" height="200" rx="40" fill="url(#bg)"/>
  <!-- Hairline inner border for premium finish -->
  <rect x="2" y="2" width="196" height="196" rx="38"
        stroke="white" stroke-opacity="0.07" stroke-width="1.5" fill="none"/>

  <!--
    ── Interlocking PS Monogram ──
    Drawing order creates the weave:
      1. S lower arc  (behind P's vertical spine)
      2. P spine + bowl  (covers the hidden part of S)
      3. S upper arc  (in front of P)
    Result: S threads through P — true interlocking.
  -->

  <!-- 1 ▸ S lower arc — behind P -->
  <path d="M 130,110 Q 46,110 46,142 Q 46,156 74,156"
        stroke="url(#sg)" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2a ▸ P — vertical spine (covers S lower where it crosses) -->
  <rect x="38" y="44" width="16" height="112" rx="8" fill="white"/>

  <!-- 2b ▸ P — D-bowl (opens right, sits atop spine) -->
  <path d="M 46,44 Q 116,44 116,78 Q 116,112 46,112"
        stroke="white" stroke-width="16" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3 ▸ S upper arc — in front of P -->
  <path d="M 130,44 Q 168,44 168,78 Q 168,112 130,112"
        stroke="url(#sg)" stroke-width="16" fill="none"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Junction accent dot — marks where P and S meet -->
  <circle cx="130" cy="111" r="5.5" fill="#22D3EE" opacity="0.75"/>
</svg>
