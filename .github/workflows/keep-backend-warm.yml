name: Keep backend warm

# The Render free-tier plan for caflow-api spins the instance down after ~15
# minutes of inactivity; the next real request then has to wait through a
# 30-60s cold start, which browsers report as a misleading CORS/"Failed to
# fetch" error since no response ever comes back to carry CORS headers. A
# ping every 10 minutes is real "activity" from Render's point of view, so
# the instance never gets a long enough idle gap to spin down. Upgrading off
# the free tier would remove the need for this entirely, but isn't an option
# right now.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint (retries to absorb transient blips)
        run: |
          curl -fsS --max-time 60 https://practicesync-ai.onrender.com/health \
            || curl -fsS --max-time 60 https://practicesync-ai.onrender.com/health \
            || curl -fsS --max-time 60 https://practicesync-ai.onrender.com/health
