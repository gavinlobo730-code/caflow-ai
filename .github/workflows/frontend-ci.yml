name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"

# One run per branch. Pushing again to an open PR supersedes the previous run,
# and without this the old one keeps going to completion — paying full price for
# a result nobody will read. The account hit 100% of its 2,000 included Actions
# minutes on 16 Aug 2026, and a busy PR branch re-running a ~6 minute real-
# Postgres job for every intermediate push is a large part of why.
#
# main is excluded from cancellation: those runs gate what is already merged, so
# they must finish even when several merges land together.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: lint · typecheck · test · build (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      # Node >=22.6 required for --experimental-strip-types (the zero-dependency
      # *.test.ts suite runs directly on node:test with no transpile step).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Type check
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

      - name: Test
        working-directory: apps/web
        run: pnpm test

      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: pnpm build
