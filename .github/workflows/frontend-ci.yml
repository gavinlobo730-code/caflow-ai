name: Frontend CI

# NO `paths:` FILTER HERE, DELIBERATELY — see the same note in backend-ci.yml.
#
# A path-filtered workflow does not run when the filter misses, so its check
# never reports, and GitHub treats a required check that never reports as
# pending forever rather than as passing. The backend pair hit exactly that and
# left a frontend-only PR unmergeable with no failing check to point at.
#
# This job is not a required check today, but it is the meaningful one for any
# frontend change and it should be. Filtering inside (the `scope` job below)
# rather than in `on:` is what makes it safe to require.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch. Pushing again to an open PR supersedes the previous run,
# and without this the old one keeps going to completion — paying full price for
# a result nobody will read. The account hit 100% of its 2,000 included Actions
# minutes on 16 Aug 2026, and a busy PR branch re-running a ~6 minute real-
# Postgres job for every intermediate push is a large part of why.
#
# main is excluded from cancellation: those runs gate what is already merged, so
# they must finish even when several merges land together.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The path filter that used to sit in `on:`. Here instead, so the job still
  # RUNS (and so still reports) on a change that does not touch the frontend.
  scope:
    name: scope — does this touch the frontend?
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.detect.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # Cannot tell what changed -> build everything. A wasted run is
          # cheaper than a skipped suite reporting success.
          if [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit — running the full frontend suite."
            exit 0
          fi
          if git diff --name-only "$base" "$head" \
             | grep -qE '^(apps/web/|\.github/workflows/frontend-ci\.yml$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "Frontend files changed — running the full frontend suite."
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "No frontend files changed — this job will report green without running."
          fi

  ci:
    name: lint · typecheck · test · build (Node 22)
    runs-on: ubuntu-latest
    needs: scope

    steps:
      - uses: actions/checkout@v4

      - if: needs.scope.outputs.web == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      # Node >=22.6 required for --experimental-strip-types (the zero-dependency
      # *.test.ts suite runs directly on node:test with no transpile step).
      - if: needs.scope.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        if: needs.scope.outputs.web == 'true'
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: needs.scope.outputs.web == 'true'
        working-directory: apps/web
        run: pnpm lint

      - name: Type check
        if: needs.scope.outputs.web == 'true'
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

      - name: Test
        if: needs.scope.outputs.web == 'true'
        working-directory: apps/web
        run: pnpm test

      - name: Build
        if: needs.scope.outputs.web == 'true'
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: pnpm build

      - name: No frontend changes
        if: needs.scope.outputs.web != 'true'
        run: echo "Nothing under apps/web changed — the frontend suite has nothing to prove here."
