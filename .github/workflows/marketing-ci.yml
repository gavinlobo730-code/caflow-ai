name: Marketing CI

on:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - ".github/workflows/marketing-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - ".github/workflows/marketing-ci.yml"

# One run per branch. Pushing again to an open PR supersedes the previous run,
# and without this the old one keeps going to completion for a result nobody
# will read — a busy PR branch re-running a ~6 minute real-Postgres job for
# every intermediate push, each leaving a stale verdict in the checks list.
# This is about time and signal, not a minutes budget: the repository is public,
# where GitHub-hosted runner minutes are free (wake-before-scheduler.yml says the
# same).
#
# main is excluded from cancellation: those runs gate what is already merged, so
# they must finish even when several merges land together.
concurrency:
  group: marketing-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: lint · typecheck · build (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/marketing/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/marketing
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/marketing
        run: pnpm lint

      - name: Type check
        working-directory: apps/marketing
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: apps/marketing
        run: pnpm build
