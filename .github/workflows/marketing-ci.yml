name: Marketing CI

on:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - ".github/workflows/marketing-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - ".github/workflows/marketing-ci.yml"

jobs:
  ci:
    name: lint · typecheck · build (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/marketing/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/marketing
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/marketing
        run: pnpm lint

      - name: Type check
        working-directory: apps/marketing
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: apps/marketing
        run: pnpm build
