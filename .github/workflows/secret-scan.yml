# Fails a change that commits a secret (engineering-05).
#
# WHAT IT DOES
#     Runs gitleaks, pinned to one version and checked against its published SHA-256 before it
#     is executed, over the commits a pull request or a push adds, and over ALL of history once
#     a week. The range is chosen by .github/scripts/secret-scan.sh; the rules and the reviewed
#     allowlists are .gitleaks.toml — read its header before adding an allowlist.
#
#     On 30-09-2026 it was run by hand over this repository: 2,519 commits, 26 findings in
#     history and 8 in the working tree before the config, NONE of them a real credential
#     (example-file placeholders, test ids, a UI storage label, and the public anon key that
#     ships to every browser), and clean after it. So this starts green and means something
#     when it goes red.
#
# WHY THE BINARY AND NOT gitleaks/gitleaks-action
#     The action needs a licence key on an organisation's repository and is one more third-party
#     thing to keep current. The release tarball is fetched from the project's own release page,
#     its SHA-256 is checked against the value below BEFORE extraction, and the version is named
#     in one place. To move to a newer release: download it, read its checksums file, change both
#     values together. Dependabot does not watch this — it is not a package or an action.
#
# A REQUIRED CHECK IS A SETTING, NOT A FILE
#     This workflow carries NO `paths:` filter and its one job has a fixed name, which is what
#     makes it safe to require (CLAUDE.md: a path-filtered workflow does not run when the
#     filter misses and GitHub treats the check as pending for ever). Making it required is
#     Settings → Branches → the rule for main → "secret scan — gitleaks", and only the repository
#     owner can do it. Until then it reports but does not block.
#
# IT COMPLEMENTS GITHUB'S OWN SECRET SCANNING, IT DOES NOT REPLACE IT
#     GitHub scans public repositories for PARTNER token formats and can block a push that
#     contains one (push protection). gitleaks knows this project's own shapes — a Supabase
#     service-role JWT, a Groq key — that no partner scheme covers. Both should be on.
#
# `--redact` IS IN THE SCRIPT, NOT HERE: the log of a public repository is public.
name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Mondays 03:47 UTC (09:17 IST): everything, not just the week's commits.
    - cron: "47 3 * * 1"
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: secret scan — gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # The range a pull request adds is BASE..HEAD, and both ends have to be present.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified before it runs)
        env:
          GITLEAKS_VERSION: "8.30.0"
          # From gitleaks_8.30.0_checksums.txt on the release page, for linux_x64.
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/bin" gitleaks
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: .github/scripts/secret-scan.sh
