name: Backend CI

# NO `paths:` FILTER HERE, DELIBERATELY — and it must stay that way.
#
# `pytest — mock mode (Python 3.11)` and `migration apply — real Postgres 16`
# are REQUIRED status checks on main. A path-filtered workflow simply does not
# run when the filter misses, so those contexts never report at all — and GitHub
# treats a required check that never reports as pending forever, not as passing.
# A frontend-only PR was therefore unmergeable with no failing check to point at
# ("2 of 2 required status checks are expected").
#
# The filter has moved INSIDE, to the `scope` job below: both required jobs now
# always run and always report, and only their expensive steps are skipped when
# nothing under apps/api changed. A frontend-only PR pays a few seconds instead
# of ~7 minutes, so the minute budget this file worries about is preserved.
#
# `paths-ignore` is NOT the fix. It is not the inverse of `paths` — a PR
# touching both apps/api and apps/web satisfies both, so the real job and a
# shim would each report the same check name.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch. Pushing again to an open PR supersedes the previous run,
# and without this the old one keeps going to completion — paying full price for
# a result nobody will read. The account hit 100% of its 2,000 included Actions
# minutes on 16 Aug 2026, and a busy PR branch re-running a ~6 minute real-
# Postgres job for every intermediate push is a large part of why.
#
# main is excluded from cancellation: those runs gate what is already merged, so
# they must finish even when several merges land together.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The path filter that used to sit in `on:`. Computing it here instead of
  # there is the whole point: the required jobs still RUN (and so still report a
  # verdict) on a change that does not touch the backend — they just do nothing.
  scope:
    name: scope — does this touch the backend?
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Both sides of the comparison have to be present locally.
          fetch-depth: 0

      - id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # A first push, a force-push, or a base we cannot resolve leaves us
          # unable to tell what changed. Run everything: a wasted seven minutes
          # is cheaper than a skipped suite that reports success.
          if [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit — running the full backend suite."
            exit 0
          fi
          if git diff --name-only "$base" "$head" \
             | grep -qE '^(apps/api/|\.github/workflows/backend-ci\.yml$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "Backend files changed — running the full backend suite."
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
            echo "No backend files changed — the required jobs will report green without running."
          fi

  test:
    name: pytest — mock mode (Python 3.11)
    runs-on: ubuntu-latest
    needs: scope

    steps:
      - uses: actions/checkout@v4

      - if: needs.scope.outputs.api == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        if: needs.scope.outputs.api == 'true'
        working-directory: apps/api
        run: pip install -r requirements.txt

      - name: Run tests (in-memory / FakeDB)
        if: needs.scope.outputs.api == 'true'
        working-directory: apps/api
        env:
          APP_ENV: development
        # Includes the database-free schema-contract test
        # (tests/test_schema_contract.py), which fails if code references a
        # table/RPC that no migration creates.
        run: pytest tests/ -v --tb=short

      - name: No backend changes
        if: needs.scope.outputs.api != 'true'
        run: echo "Nothing under apps/api changed — the backend suite has nothing to prove here."

  migrations:
    name: migration apply — real Postgres 16
    runs-on: ubuntu-latest
    needs: scope

    services:
      postgres:
        # Pinned minor (not the floating `postgres:16` tag) so the migration-apply
        # ratchet stays deterministic across runner image updates.
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - if: needs.scope.outputs.api == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install psql client
        if: needs.scope.outputs.api == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # Full requirements, not just pytest. The glob below collects every
      # tests/test_*_pg.py, and such a test may legitimately import application
      # code — test_r3_14_health_scores_schema_pg.py imports routers.health to
      # check the Python scoring against the DB schema it asserts on. A
      # module-level import like that runs at COLLECTION time, so a
      # pytest.mark.skipif on the module cannot protect it: with only pytest
      # installed, collection died on ModuleNotFoundError: fastapi and pytest
      # exited 2, failing the whole job before a single migration was applied.
      # Installing the real dependency set is what makes the glob's
      # "picks up future ones automatically" promise actually hold.
      - name: Install dependencies
        if: needs.scope.outputs.api == 'true'
        working-directory: apps/api
        run: pip install -r requirements.txt

      # Applies the full migration set (with the Supabase-compat bootstrap) to a
      # throwaway database and asserts the set of migrations that fail to apply
      # equals the documented drift baseline (tests/test_migrations_apply.py).
      # New invalid SQL / ordering drift fails here; a fixed migration also fails
      # (forcing the baseline to shrink) — see roadmap R2.6.
      #
      # task #244 comparative-reliability review finding: this step used to run
      # ONLY test_migrations_apply.py, even though 19 other tests/test_*_pg.py
      # files exist — real-Postgres regression tests for exactly the kind of
      # thing a mock-mode FakeDB test can't prove (RLS policies, atomic RPCs
      # like post_journal_atomic/settle_receipt_atomic, real UNIQUE-constraint
      # races). They all self-skip when HARNESS_PG isn't set (see each file's
      # pytestmark), so they were silently never executed anywhere — a
      # migration's own SQL could regress with nothing in CI to catch it. This
      # glob picks up every such file, including future ones, automatically.
      - name: Run real-Postgres regression suite (migration ratchet + atomic RPCs + RLS)
        if: needs.scope.outputs.api == 'true'
        working-directory: apps/api
        env:
          # 127.0.0.1 (not localhost) so libpq targets the IPv4-published service
          # port directly and never stalls on an IPv6 ::1 attempt first.
          HARNESS_PG: "host=127.0.0.1 port=5432 user=postgres password=postgres"
        run: pytest tests/test_migrations_apply.py tests/test_atomic_journal_posting.py tests/test_*_pg.py -v --tb=short

  # task #244: apps/api/migrations/*.sql previously had NO automated path to the
  # real production database — Render auto-deploys code on every push to main,
  # but nothing applied the matching migrations. Migrations 233-241 sat
  # committed and CI-validated (by the `migrations` job above, against a
  # throwaway Postgres) but unapplied to production for up to 6 days, while
  # their dependent code was already live and silently failing. This job closes
  # that gap: on every push to main, once tests + the migration-apply ratchet
  # both pass, apply any migration not yet recorded in production's own
  # schema_migrations tracking table (scripts/db/apply_migrations.py — already
  # idempotent/checksum-tracked, just never wired into a pipeline before now).
  #
  # Never runs on pull_request — only a merge to main may touch the real
  # database. --only-schema skips pure data-seed migrations (see
  # apply_migrations.py's SEED_MIGRATIONS). No --continue-on-error: a failed
  # migration stops the run immediately rather than attempting later ones that
  # may depend on it against a database now in an unknown partial state.
  deploy-migrations:
    name: apply pending migrations — production
    runs-on: ubuntu-latest
    # The scope condition keeps this exactly as selective as it was when the
    # filter lived in `on:` — a merge that touches no backend file has no
    # migration to apply, and this job connects to the production database.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.scope.outputs.api == 'true'
    needs: [scope, test, migrations]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply pending migrations to production
        working-directory: apps/api
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set — cannot apply migrations to production." \
                 "Add it under Settings > Secrets and variables > Actions (see docs/deploy-migrations.md)."
            exit 1
          fi
          python scripts/db/apply_migrations.py --dsn "$SUPABASE_DB_URL" --only-schema --json
