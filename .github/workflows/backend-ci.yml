name: Backend CI

# NO `paths:` FILTER HERE, DELIBERATELY — and it must stay that way.
#
# `pytest — mock mode (Python 3.11)` and `migration apply — real Postgres 16`
# are REQUIRED status checks on main. A path-filtered workflow simply does not
# run when the filter misses, so those contexts never report at all — and GitHub
# treats a required check that never reports as pending forever, not as passing.
# A frontend-only PR was therefore unmergeable with no failing check to point at
# ("2 of 2 required status checks are expected").
#
# The filter has moved INSIDE, to the `scope` job below: both required jobs now
# always run and always report, and only their expensive steps are skipped when
# nothing under apps/api changed. A frontend-only PR pays a few seconds instead
# of ~7 minutes, so the minute budget this file worries about is preserved.
#
# `paths-ignore` is NOT the fix. It is not the inverse of `paths` — a PR
# touching both apps/api and apps/web satisfies both, so the real job and a
# shim would each report the same check name.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch. Pushing again to an open PR supersedes the previous run,
# and without this the old one keeps going to completion for a result nobody
# will read — a busy PR branch re-running a ~6 minute real-Postgres job for
# every intermediate push, each leaving a stale verdict in the checks list.
# This is about time and signal, not a minutes budget: the repository is public,
# where GitHub-hosted runner minutes are free (wake-before-scheduler.yml says the
# same).
#
# main is excluded from cancellation: those runs gate what is already merged, so
# they must finish even when several merges land together.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The path filter that used to sit in `on:`. Computing it here instead of
  # there is the whole point: the required jobs still RUN (and so still report a
  # verdict) on a change that does not touch the backend — they just do nothing.
  scope:
    name: scope — does this touch the backend?
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Both sides of the comparison have to be present locally.
          fetch-depth: 0

      - id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # A first push, a force-push, or a base we cannot resolve leaves us
          # unable to tell what changed. Run everything: a wasted seven minutes
          # is cheaper than a skipped suite that reports success.
          if [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit — running the full backend suite."
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$head")"
          if printf '%s\n' "$changed" \
             | grep -qE '^(apps/api/|\.github/workflows/backend-ci\.yml$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "Backend files changed — running the full backend suite."
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
            echo "No backend files changed — the required jobs will report green without running."
          fi
          # A frontend-only diff used to leave EVERY python guard unrun, which
          # is how `browser-contract` below came to exist. See its header.
          # BOTH frontends. apps/marketing is a second Next.js app on its own
          # Cloudflare project, and a marketing-only diff touches no apps/api
          # file — so without it here it would skip every python guard exactly
          # as an apps/web diff did, and
          # test_the_marketing_site_says_what_the_product_does.py would never
          # run on the change it exists to check.
          if printf '%s\n' "$changed" | grep -qE '^apps/(web|marketing)/'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "A frontend changed — the browser-contract guards will run."
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: pytest — mock mode (Python 3.11)
    runs-on: ubuntu-latest
    needs: scope

    steps:
      - uses: actions/checkout@v7

      - if: needs.scope.outputs.api == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      # From the LOCK, with hashes (engineering-04). requirements.txt is what the Docker image installs
      # and requirements-dev.txt adds, on top of it and pinned to the same versions of anything they
      # share, what only this job uses: pytest, ruff (the lint step below), hypothesis (the property tests),
      # pytest-cov (the coverage report) and pytest-xdist (the parallel run). None of those is in
      # requirements.txt because that is what the Docker image installs. Every install in this file is the
      # same command; tests/test_the_backend_installs_from_a_lock.py fails one that is not.
      - name: Install dependencies
        if: needs.scope.outputs.api == 'true'
        working-directory: apps/api
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      # THE LINT RUNS INSIDE THIS REQUIRED JOB, not as a new one, so an unused import, a bare `except:` or a
      # four-hundred-line function turns the check that already gates main red without anyone adding a required
      # status check by hand (and without a `paths:` filter, see the top of this file).
      #
      # It is a RATCHET: `ruff check` reports 1,154 findings today and a step that fails on them is red for ever,
      # so scripts/ci/ruff_ratchet.py compares them with the committed baseline and fails only on a finding the
      # baseline does not cover — or on a baseline line that no longer fires, because the baseline only shrinks.
      # Exit 2 means ruff did not run, which is never a clean result. Run it first: it takes seconds, and it
      # should not wait behind ten minutes of tests to say a name is unused.
      - name: Lint — ruff against the frozen baseline
        if: needs.scope.outputs.api == 'true'
        working-directory: apps/api
        run: python scripts/ci/ruff_ratchet.py

      # THE SUITE RUNS IN PARALLEL, in `--dist loadfile`, and that was measured before it was switched on.
      #
      # On 02-10-2026 the whole mock suite was run twice from the same tree on a four-CPU machine that other work was
      # also using: once serially, once as this step runs it (`-n 4 --dist loadfile` with coverage). Both produced 21,584
      # passes, 2,119 skips and no failure, and a junit comparison found the same 23,703 test ids with the same
      # outcome for every one. The serial run took 13 min 34 s and the parallel one 10 min 20 s WITH coverage on: a
      # gain of about a quarter of the wall time, far short of four-fold. Three things are in that gap and were not
      # separated: the coverage tracer's own cost, the other work using the machine, and `loadfile`, which keeps a
      # module on one worker (the largest single module, test_the_seeder_actually_seeds, is 124 s of the 770 s of
      # test time, and the four largest are 36% of it). What a GitHub runner makes of it has not been measured; the
      # first run through this workflow is the first reading.
      #
      # WHY IT IS SAFE TO GROUP TESTS DIFFERENTLY: module-level MOCK_* fixtures (48 of them in application code) and
      # the AI rate limiter's in-process windows are per process under xdist, so no worker can see another's, and the
      # limiter is reset before every test by an autouse fixture in tests/conftest.py. The risk is the opposite one, a
      # test that silently relies on state ANOTHER test left behind, which serial order hides and a different grouping
      # exposes; the identical outcomes above are the evidence there is none today, and they are one measurement, not
      # a proof. Every test that opens a socket binds port 0, and the tests that write files write to tmp_path or to
      # mkstemp names.
      #
      # `loadfile` and not `load`: a module's tests then stay on one worker and run in the order they were written,
      # which is what any hidden coupling INSIDE a module (a fixture that builds state the next test reads) assumes.
      # `load` was NOT measured here. If a flake ever shows up that goes away without `-n`, remove `-n auto` first;
      # nothing else in the repository depends on it.
      #
      # ONLY THIS JOB RUNS IN PARALLEL. The real-Postgres modules (`*_pg.py`, 140 of them gated on HARNESS_PG) run in the
      # migration job, serially, and a parallel run of them has not been measured: several create a database of a fixed
      # name, so `-n` with HARNESS_PG set is not safe to assume.
      #
      # THE COVERAGE REPORT COMES FROM THE SAME RUN (pytest-cov merges what each worker measured), so measuring costs
      # no second pass. It covers domain/ and services/, the two places the statutory and money rules live, and
      # scripts/ci/coverage_floor.py holds each above a recorded floor in the next step. Only the mock-mode suite is
      # measured here: the real-Postgres tests run in the other job and are not part of this number.
      - name: Run tests (in-memory / FakeDB), in parallel, with coverage
        if: needs.scope.outputs.api == 'true'
        working-directory: apps/api
        env:
          APP_ENV: development
        # Includes the database-free schema-contract test
        # (tests/test_schema_contract.py), which fails if code references a
        # table/RPC that no migration creates.
        run: >-
          pytest tests/ -v --tb=short -n auto --dist loadfile
          --cov=domain --cov=services
          --cov-report=term:skip-covered --cov-report=json:coverage.json

      # A TOOL THAT DID NOT RUN IS NOT A CLEAN RESULT: `if: always()` is NOT used. If the tests failed there is no
      # honest coverage figure to compare, and the floor step would only add a second red mark to a red job. It
      # exits 2, never 0, when the report is missing or measured nothing.
      - name: Coverage — report it, and hold the recorded floor
        if: needs.scope.outputs.api == 'true'
        working-directory: apps/api
        run: python scripts/ci/coverage_floor.py coverage.json

      - name: Keep the coverage report with the run
        if: needs.scope.outputs.api == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/api/coverage.json
          retention-days: 14

      - name: No backend changes
        if: needs.scope.outputs.api != 'true'
        run: echo "Nothing under apps/api changed — the backend suite has nothing to prove here."

  migrations:
    name: migration apply — real Postgres 16
    runs-on: ubuntu-latest
    needs: scope

    services:
      postgres:
        # Pinned minor (not the floating `postgres:16` tag) so the migration-apply
        # ratchet stays deterministic across runner image updates.
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - if: needs.scope.outputs.api == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      # THIRD-PARTY APT SOURCES ARE DROPPED BEFORE THE UPDATE, and that is not
      # belt-and-braces — it is what keeps this REQUIRED check from being taken
      # down by a repository nothing here uses.
      #
      # `apt-get update` exits 100 if ANY configured source is inconsistent, and
      # the runner image ships several this job has no use for. On 2026-09-09
      # Google's Chrome repository served a Packages.gz whose SHA256 was
      # bc1428ab... while its own Release file said 233e56de..., and this check
      # failed on a pull request that touches neither Chrome nor apt. It failed
      # identically on a re-run twenty minutes later, so it was not a blip: it
      # would have blocked every PR in this repository until Google fixed their
      # CDN.
      #
      # Only dl.google.com sources are removed, matched by CONTENT rather than
      # by filename so the .list/.sources format change does not matter. The
      # Ubuntu archive is untouched and a genuine failure there is still fatal,
      # which is the property worth keeping: postgresql-client comes from
      # Ubuntu, and if THAT cannot be fetched this job must not proceed.
      - name: Install psql client
        if: needs.scope.outputs.api == 'true'
        run: |
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      # Full requirements, not just pytest. The glob below collects every
      # tests/test_*_pg.py, and such a test may legitimately import application
      # code — test_r3_14_health_scores_schema_pg.py imports routers.health to
      # check the Python scoring against the DB schema it asserts on. A
      # module-level import like that runs at COLLECTION time, so a
      # pytest.mark.skipif on the module cannot protect it: with only pytest
      # installed, collection died on ModuleNotFoundError: fastapi and pytest
      # exited 2, failing the whole job before a single migration was applied.
      # Installing the real dependency set is what makes the glob's
      # "picks up future ones automatically" promise actually hold.
      - name: Install dependencies
        if: needs.scope.outputs.api == 'true'
        working-directory: apps/api
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      # THE SERVER'S OWN LOG IS QUIETED SO A FAILURE IN THE STEP BELOW CAN BE READ.
      # The log service that returns a job's output hands back only its last 5,000
      # lines, and the service container's log is dumped AFTER every step. With
      # checkpoints logged (the suite creates and drops hundreds of databases, and
      # each one forces a CHECKPOINT) and every deliberate constraint violation the
      # tests provoke logged as an ERROR, that dump is far longer than 5,000 lines,
      # so the pytest summary above it was unreachable: on 2 October 2026 this job
      # failed on two consecutive pushes to main while passing on the pull requests
      # carrying the same tree, and the failing test could not be named from the
      # log. Nothing here asserts on the server's log, so only what is not a FATAL
      # is silenced; the test output is untouched and now sits inside the window.
      - name: Quiet the Postgres server's own log
        if: needs.scope.outputs.api == 'true'
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          ALTER SYSTEM SET log_checkpoints = off;
          ALTER SYSTEM SET log_min_messages = fatal;
          ALTER SYSTEM SET log_min_error_statement = fatal;
          SELECT pg_reload_conf();
          SQL

      # Applies the full migration set (with the Supabase-compat bootstrap) to a
      # throwaway database and asserts the set of migrations that fail to apply
      # equals the documented drift baseline (tests/test_migrations_apply.py).
      # New invalid SQL / ordering drift fails here; a fixed migration also fails
      # (forcing the baseline to shrink) — see roadmap R2.6.
      #
      # task #244 comparative-reliability review finding: this step used to run
      # ONLY test_migrations_apply.py, even though 19 other tests/test_*_pg.py
      # files exist — real-Postgres regression tests for exactly the kind of
      # thing a mock-mode FakeDB test can't prove (RLS policies, atomic RPCs
      # like post_journal_atomic/settle_receipt_atomic, real UNIQUE-constraint
      # races). They all self-skip when HARNESS_PG isn't set (see each file's
      # pytestmark), so they were silently never executed anywhere — a
      # migration's own SQL could regress with nothing in CI to catch it. This
      # glob picks up every such file, including future ones, automatically.
      - name: Run real-Postgres regression suite (migration ratchet + atomic RPCs + RLS)
        if: needs.scope.outputs.api == 'true'
        working-directory: apps/api
        env:
          # 127.0.0.1 (not localhost) so libpq targets the IPv4-published service
          # port directly and never stalls on an IPv6 ::1 attempt first.
          HARNESS_PG: "host=127.0.0.1 port=5432 user=postgres password=postgres"
        run: pytest tests/test_migrations_apply.py tests/test_atomic_journal_posting.py tests/test_*_pg.py -v --tb=short

  # THE GUARD THAT PROTECTS THE REDESIGN USED TO BE SWITCHED OFF BY THE REDESIGN.
  #
  # `scope` skips the two required jobs when a diff touches no apps/api file,
  # and says so in its own log: "the required jobs will report green without
  # running". A module conversion is an apps/web-only diff, so
  # test_the_redesign_cannot_orphan_an_endpoint.py — written precisely to catch
  # a screen that quietly stops calling its engine — never ran on the pull
  # requests it exists to protect. Measured on 16 Sep 2026: 134 of 160 screens
  # could be deleted outright with the guard reporting zero losses, and nothing
  # in CI would have evaluated it anyway.
  #
  # Widening `api` to include apps/web is the obvious fix and the wrong one:
  # that buys a ~7 minute suite plus a ~6 minute real-Postgres job on every
  # frontend push — about thirteen minutes of waiting, on a change that cannot
  # fail them because nothing under apps/api moved. It is the wait that costs,
  # not minutes (the repository is public, where they are free; see the
  # concurrency comment above). A redesign is dozens of PRs with several pushes
  # each.
  #
  # So this job runs ONLY the modules that can actually see an apps/web change —
  # about 33 files, ~700 tests, ~50 seconds. The list is DERIVED, not held:
  # scripts/ci/tests_reading_the_browser.py finds the modules that build the
  # apps/web path and, transitively, the ones that import them. A guard added
  # later is picked up with no edit here, and the import step is not optional —
  # the orphan-endpoint guard has no path of its own and would be missed by a
  # grep.
  #
  # ⚠️ ONE RESIDUAL, NAMED RATHER THAN HIDDEN. The three `*_pg.py` frontend
  # guards (columns exist, status vocabulary, auth-id FKs) self-skip here
  # because they need HARNESS_PG, and giving this job a Postgres service means
  # applying 470 migrations — the cost this job exists to avoid. They protect
  # against a frontend change naming a column or status the schema does not
  # have, which IS a real apps/web risk, and today that is caught only when the
  # same PR also touches apps/api. Closing it properly means a mock-mode
  # variant reading the committed production snapshot in tests/fixtures/
  # instead of a live database; that is a build, not a config change.
  browser-contract:
    name: browser contract — python guards that read a frontend
    runs-on: ubuntu-latest
    needs: scope
    # Runs when apps/web changed. When apps/api changed too, the full suite
    # above already covers these, so this is skipped as redundant.
    if: needs.scope.outputs.web == 'true' && needs.scope.outputs.api != 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      # Full requirements rather than bare pytest: several of these modules
      # import application code at module scope (routers, domain), which runs
      # at COLLECTION time, so a missing dependency kills the run before a
      # single assertion — the same trap the migrations job documents above.
      - name: Install dependencies
        working-directory: apps/api
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Run the guards that read a frontend
        working-directory: apps/api
        env:
          APP_ENV: development
        run: |
          set -euo pipefail
          # The script exits non-zero if it finds nothing, so an empty list can
          # never become a bare `pytest` over the whole suite.
          mapfile -t modules < <(python3 scripts/ci/tests_reading_the_browser.py)
          echo "Running ${#modules[@]} modules that read a frontend:"
          printf '  %s\n' "${modules[@]}"
          pytest "${modules[@]}" -v --tb=short

  # task #244: apps/api/migrations/*.sql previously had NO automated path to the
  # real production database — Render auto-deploys code on every push to main,
  # but nothing applied the matching migrations. Migrations 233-241 sat
  # committed and CI-validated (by the `migrations` job above, against a
  # throwaway Postgres) but unapplied to production for up to 6 days, while
  # their dependent code was already live and silently failing. This job closes
  # that gap: on every push to main, once tests + the migration-apply ratchet
  # both pass, apply any migration not yet recorded in production's own
  # schema_migrations tracking table (scripts/db/apply_migrations.py — already
  # idempotent/checksum-tracked, just never wired into a pipeline before now).
  #
  # Never runs on pull_request — only a merge to main may touch the real
  # database. --only-schema skips pure data-seed migrations (see
  # apply_migrations.py's SEED_MIGRATIONS). No --continue-on-error: a failed
  # migration stops the run immediately rather than attempting later ones that
  # may depend on it against a database now in an unknown partial state.
  deploy-migrations:
    name: apply pending migrations — production
    runs-on: ubuntu-latest
    # The scope condition keeps this exactly as selective as it was when the
    # filter lived in `on:` — a merge that touches no backend file has no
    # migration to apply, and this job connects to the production database.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.scope.outputs.api == 'true'
    needs: [scope, test, migrations]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install psql client
        # The SAME drop as the migrations job above, and it has to be here too:
        # this job has its own runner, so hardening one copy left the other
        # exposed. That is exactly what happened — see the commit message.
        run: |
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply pending migrations to production
        working-directory: apps/api
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set — cannot apply migrations to production." \
                 "Add it under Settings > Secrets and variables > Actions (see docs/deploy-migrations.md)."
            exit 1
          fi
          python scripts/db/apply_migrations.py --dsn "$SUPABASE_DB_URL" --only-schema --json
