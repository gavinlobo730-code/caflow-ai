# Calls the real API as a real user and fails on a non-2xx or an over-budget
# response.
#
# WHY IT IS NOT ON PULL REQUESTS
#     It needs credentials and a live deployment. Gating every PR on a
#     third-party service that can be cold, rate-limited, or mid-deploy trains
#     people to ignore red, and an ignored check is worse than no check. This
#     runs on a schedule and on demand, where a failure means "go look" rather
#     than "your diff is bad".
#
# WHY IT EXISTS AT ALL
#     Every other check in this repo is static — source parsed against a schema,
#     or against the TypeScript AST. All of them were green on a build where the
#     client Overview page did not load, /health returned 503,
#     /api/identity/permissions returned 403 five times, and
#     /api/accounting/cash-flow took 57 seconds. Nothing in CI had ever called a
#     running instance.
#
# IF THE SECRETS ARE NOT SET
#     scripts/smoke_api.py prints which variables are missing and exits 0. The
#     job goes green having done nothing, on purpose — see the "skipped" line in
#     its output. Set the repository secrets below to turn it on.
#
# WHAT IT LEAVES BEHIND (ops-12)
#     Each run that measured anything uploads `smoke-timings-live-<run id>-<attempt>`:
#     one small JSON file with every endpoint's response time, its budget and its
#     target, the wake time, the commit and the run id. NEVER a URL, a path, a client
#     id or a credential (write_timings in the script says why, and a test reads the
#     file for them). A run aimed at a candidate through `base_url` is named
#     `smoke-timings-candidate-…`, so a deployment nobody is on yet does not enter
#     the live service's history. Artifacts are kept 90 days, GitHub's longest.
#
#     The last step reads every `smoke-timings-live-` artifact of the last 30 days
#     back through the API and writes the table scripts/smoke_timings_report.py makes
#     to this run's summary page: per endpoint, how many samples, the p50, the p95,
#     the target and a verdict, and the p95 week by week so a drift shows before a CA
#     notices it. THE HISTORY IS THE ARTIFACTS THEMSELVES. Nothing is committed to the
#     repository and nothing is stored anywhere that can disagree with them. When the
#     artifacts do not yet span 30 days the table says how many days it does cover
#     rather than presenting a week as a month.
#
#     A TARGET IS NOT A GATE. The script's budgets fail a run; the targets are judged
#     on the table and never fail anything, and that last step is `continue-on-error`:
#     telemetry about the check must not turn a green API red. Tightening a budget is
#     a separate change that cites the table (docs/operations/service-levels.md).
name: API smoke

on:
  schedule:
    # Every 6 hours. Frequent enough to catch a regression the same day,
    # infrequent enough that a free-tier instance is not kept awake by CI.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        # WHY THIS OVERRIDE EXISTS
        #     Render cannot move a service between regions, so changing region
        #     means standing up a SECOND service and cutting over to it. The
        #     whole point of that window is to measure the candidate BEFORE any
        #     user traffic reaches it — and the only instrument that measures it
        #     is this workflow.
        #
        #     Without an override the only way to point the smoke check at the
        #     candidate is to edit the SMOKE_BASE_URL secret, which silently
        #     re-aims the SCHEDULED runs too. The deployment users are actually
        #     on then stops being watched, during the exact window when someone
        #     is changing infrastructure around it. That is backwards.
        #
        #     With the override, scheduled runs keep watching the live
        #     deployment and a human can smoke a candidate on demand. The secret
        #     changes once, at cutover, when the candidate has earned it.
        description: >-
          API to smoke, e.g. https://practicesync-api.onrender.com. Leave blank
          to use the SMOKE_BASE_URL secret (the live deployment). Set it to test
          a candidate deployment before cutting over to it.
        required: false
        type: string

# Least privilege, spelled out. `actions: read` is what lets the last step list and download
# this workflow's own earlier artifacts; `contents: read` is the checkout. Nothing here writes.
permissions:
  contents: read
  actions: read

jobs:
  smoke:
    name: real API — status + latency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install httpx
        run: pip install --no-cache-dir httpx

      - name: Smoke the API
        working-directory: apps/api
        env:
          # `inputs.base_url` is empty on a scheduled run, so the secret — the
          # live deployment — is what the schedule keeps watching. Only an
          # explicit dispatch input re-aims it.
          SMOKE_BASE_URL: ${{ inputs.base_url || secrets.SMOKE_BASE_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          # A client with a REAL ledger. Pointing this at an empty client would
          # make every check pass in milliseconds while proving nothing — the
          # endpoint that took 57s was serving 12,836 entries.
          SMOKE_CLIENT_ID: ${{ secrets.SMOKE_CLIENT_ID }}
          # Where the run keeps its timings (relative to apps/api), uploaded below.
          SMOKE_TIMINGS_FILE: timings/smoke-timings.json
          # `live` unless a person aimed this run at a candidate with `base_url`.
          SMOKE_DEPLOYMENT: ${{ inputs.base_url && 'candidate' || 'live' }}
        run: python3 scripts/smoke_api.py

      # Even when the run FAILED: an over-budget run is the one worth keeping. A run
      # that was skipped for want of credentials measured nothing and left no file,
      # which is why a missing file is not a warning.
      - name: Keep this run's timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-timings-${{ inputs.base_url && 'candidate' || 'live' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/api/timings/smoke-timings.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Summarise the last 30 days of timings
        if: always()
        # Telemetry about the check, never part of it: see the header.
        continue-on-error: true
        working-directory: apps/api
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          mkdir -p history
          cutoff="$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          # Newest first; every artifact of this repository, filtered to this workflow's
          # live ones inside the window. `expired` ones cannot be downloaded.
          gh api --paginate "repos/${REPO}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false and (.name | startswith(\"smoke-timings-live-\")) and .created_at >= \"${cutoff}\") | .id" \
            > history/ids.txt || echo "could not list earlier artifacts; reporting this run alone"
          while read -r id; do
            [ -n "${id}" ] || continue
            if gh api "repos/${REPO}/actions/artifacts/${id}/zip" > "history/${id}.zip" \
               && unzip -oq "history/${id}.zip" -d "history/${id}"; then
              :
            else
              echo "could not fetch artifact ${id}; it is left out of the table"
            fi
          done < history/ids.txt
          # This run's own file too, in case the listing does not show it yet; the report
          # counts one run once.
          python3 scripts/smoke_timings_report.py history timings --days 30 >> "${GITHUB_STEP_SUMMARY}"
