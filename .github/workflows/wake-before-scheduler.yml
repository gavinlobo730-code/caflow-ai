# Keeps the API awake across the daily scheduler window.
#
# WHY THIS EXISTS
#   jobs/scheduler.py runs IN PROCESS: APScheduler fires run_daily_jobs() at
#   06:00 IST inside the live FastAPI worker. On Render's free tier the
#   instance spins down after ~15 minutes without inbound traffic, and a
#   stopped process cannot fire a timer. At 6am nobody is using the app, so
#   without this the instance is asleep and the day's jobs — compliance
#   reminders, recurring invoices, overdue transitions, collections, customer
#   reminders, compliance escalations — simply never run.
#
#   ENABLE_SCHEDULER=true is necessary but not sufficient on a spun-down
#   instance. This workflow supplies the missing half: inbound traffic just
#   before the scheduled hour, so the process is alive when the timer fires.
#
# WHY /health AND NOT /api/scheduler/run
#   The scheduler's own warning suggests POST /api/scheduler/run, but that
#   endpoint is rbac("team", "write") — it needs a real user's JWT, which
#   expires hourly and would mean secret plumbing and a refresh flow in CI.
#   GET /health is unauthenticated and a request of any kind is all Render
#   needs to wake the service. Waking it is the whole job; the scheduler
#   already knows what to do once it is running.
#
# WHY A WINDOW AND NOT ONE PING
#   GitHub's scheduled workflows are best-effort: they routinely start 5-15
#   minutes late under load, and GitHub drops runs outright when load is high
#   enough. Render keeps an instance awake for roughly 15 minutes after the last
#   request. So a single run pinging for six minutes only covers 06:00 IST if
#   GitHub is punctual to within about a quarter of an hour (task #155).
#
# WHY THREE RUNS AND A LONGER LOOP
#   Each run now pings for 15 minutes, and three of them start 15 minutes apart
#   at 00:00 / 00:15 / 00:30 UTC (05:30 / 05:45 / 06:00 IST). Two properties
#   follow, and both matter:
#
#     - Each run's span equals the gap to the next, so consecutive runs ABUT.
#       On time, that is continuous real traffic from 05:30 to 06:15 IST — the
#       06:00 trigger sits in the middle of it, not at the ragged end of a
#       keep-alive window.
#     - GitHub delays each scheduled run independently, so a late or dropped run
#       is covered by its neighbours rather than taking the day with it.
#
#   Runs are serialised by the concurrency group below, so a late one queues
#   behind its predecessor and extends the window instead of doubling up on it.
#   This repository is public, where GitHub Actions minutes are free — the extra
#   runner time buys reliability at no cost.
#
# THIS IS BEST-EFFORT, NOT THE GUARANTEE
#   Even three runs cannot promise the instance is awake at 06:00 IST, because
#   nothing here is under our control. The actual guarantee lives in the API:
#   jobs/scheduler.py::run_catchup_if_stale runs the day's outstanding jobs at
#   startup when the 06:00 trigger was missed. This workflow makes the ordinary
#   day PUNCTUAL; that function makes every day COMPLETE. Do not delete one
#   believing the other covers it — they answer different questions.
#
# THIS IS A FREE-TIER WORKAROUND
#   A paid Render instance does not spin down and makes this file unnecessary.
#   Delete it if you upgrade — a workflow whose reason has expired is worse
#   than no workflow, because it looks load-bearing.
name: Wake API before scheduler

on:
  schedule:
    # Cron here is UTC and GitHub does not honour timezones.
    # 00:00 UTC = 05:30 IST — thirty minutes before the job.
    - cron: "0 0 * * *"
    # 00:15 UTC = 05:45 IST — the original single entry.
    - cron: "15 0 * * *"
    # 00:30 UTC = 06:00 IST — the job's own hour. Too late to keep an already
    # asleep instance awake THROUGH the trigger, and deliberately kept anyway:
    # if the first two were dropped, this wakes the process, and startup
    # catch-up then runs the day's jobs minutes late instead of never.
    - cron: "30 0 * * *"
  # So you can wake it by hand, and test this workflow without waiting a day.
  workflow_dispatch:

# Never run two of these at once; a backed-up scheduled run plus a manual
# trigger would just spend Actions minutes pinging the same URL twice.
concurrency:
  group: wake-api
  cancel-in-progress: false

jobs:
  wake:
    name: ping /health across the scheduler window
    runs-on: ubuntu-latest
    # The ping loop spans 15 minutes; the margin covers a slow cold start on the
    # first request. Must stay above the loop span or the job is killed mid-window.
    timeout-minutes: 25

    steps:
      - name: Wake the instance and hold it awake
        env:
          # Not a secret — this is the public API origin.
          #
          # practicesync-API (Singapore), not practicesync-AI (Oregon, deleted
          # 2026-08-15). One character apart, and getting it wrong here is
          # silent: the ping fails, nobody is watching this workflow, and the
          # instance is simply asleep when the 06:00 IST timer would have fired.
          API: https://practicesync-api.onrender.com
        run: |
          set -uo pipefail
          ok=0
          # Six pings, three minutes apart — a 15-minute span, which is both the
          # gap to the next scheduled run (so the runs abut) and Render's
          # keep-alive window (so no gap opens inside one run either).
          for attempt in 1 2 3 4 5 6; do
            # --max-time 90: a cold start on the free tier takes up to ~50s,
            # so the FIRST request is expected to be slow. Failing it at the
            # default timeout would report a healthy service as down.
            # `code=$(...)` takes curl's exit status, so `|| code=000` REPLACES
            # the value on failure. Piping `|| echo 000` inside the
            # substitution instead would append to whatever curl already
            # printed and yield "000000".
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
                        --max-time 90 "$API/health") || code="000"
            echo "ping $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              ok=$((ok + 1))
            else
              echo "  body: $(head -c 300 /tmp/health.json 2>/dev/null)"
            fi
            # No sleep after the last ping — it would just burn three minutes,
            # and the bound must track the loop above or the span silently
            # collapses to the first few pings.
            [ "$attempt" -lt 6 ] && sleep 180
          done

          echo "healthy responses: $ok/6"
          # Fail only if EVERY ping failed. One bad response inside a 15-minute
          # window is a blip; six is the service being down, and that is worth
          # an email from GitHub — it means the 06:00 IST trigger will be missed
          # and the day's jobs wait on startup catch-up (run_catchup_if_stale),
          # which cannot help until something else wakes the instance.
          if [ "$ok" -eq 0 ]; then
            echo "::error::API did not respond on any of 6 attempts — the 06:00 IST scheduler run will not happen."
            exit 1
          fi
