# Weekly dependency update pull requests for everything this repository installs (engineering-05).
#
# WHAT IS WATCHED, AND WHY EACH ENTRY IS A SEPARATE LINE
#     The repository is three applications and one set of workflows, each with its own manifest,
#     so each gets its own entry. A `directory` that names nothing is not an error to Dependabot,
#     it is a silent no-op, so apps/api/tests/test_dependencies_are_audited_and_watched.py asserts
#     that every directory below exists and that every manifest in the tree is named here.
#
#       pip             apps/api         requirements.in + requirements.txt (and the dev pair). The .in
#                                        files are what a person edits; the .txt files are pip-compile's
#                                        hash-pinned lock, which the Docker image and CI install with
#                                        `--require-hashes`. Dependabot reads the pair and proposes the
#                                        same change `pip-compile` would (engineering-04); the audit
#                                        workflow checks the lock itself. A bump to one lock and not the
#                                        other is caught by tests/test_the_backend_installs_from_a_lock.py.
#       npm             apps/web         pnpm-lock.yaml. Dependabot's `npm` ecosystem covers pnpm.
#       npm             apps/marketing   its own lockfile and its own Cloudflare project.
#       github-actions  /                .github/workflows/*.yml
#
#     Not covered, on purpose: the Dockerfile's base image (not asked for here), and the gitleaks
#     binary that secret-scan.yml downloads, which is neither a package nor an action — its
#     version and checksum move together by hand, and the workflow says how.
#
# ONE PULL REQUEST A WEEK PER ECOSYSTEM FOR MINOR AND PATCH, A SEPARATE ONE PER MAJOR
#     Grouping stops the update stream becoming a daily chore nobody does. A MAJOR version is
#     deliberately left to arrive on its own, because it is the one that can break the build
#     (Next 14 to 15, React 18 to 19) and deserves its own review.
#
# WHAT IS DELIBERATELY IGNORED, AND UNTIL WHEN (8 October 2026, the owner's decision; ledger items
# POST-A-171, POST-A-172 and POST-A-213 in docs/open-items/)
#     Each entry below is a dependency whose newer version is a MIGRATION and not a bump, held until
#     after the 1 November 2026 demo. An ignored version produces no pull request and no group
#     member, so it cannot sit beside the safe bumps as a red check. Delete the entry in the same
#     change that adopts the version; nothing else removes it.
#       fastapi, supabase   minor and major ignored (0.x numbering: a minor IS the breaking one).
#                           fastapi moves starlette to 1.x and breaks every test that walks app.routes,
#                           and turns a missing required query parameter from a 422 into a 500;
#                           supabase removes the client class core/supabase_client._force_http1 patches,
#                           which silently reopens the HTTP/2 multi-thread bug. Patch releases still arrive.
#       next, eslint-config-next, tailwindcss, typescript, @sentry/nextjs
#                           major ignored in apps/web and apps/marketing (the two sites are on the same
#                           versions). Next 16 and Tailwind 4 fail the Cloudflare Pages build as they stand;
#                           the redirect and _headers generation and the static export are Next-sensitive.
#     Security advisories are not hidden by this: the pip-audit and pnpm audit workflows are the alarm
#     and their baselines may only shrink.
#
# WHAT THIS DOES NOT DO
#     It does not patch a vulnerability the week it is published: that is Dependabot SECURITY
#     updates, a repository setting (Settings > Code security), not something a file can turn
#     on. The audit workflow is the alarm; this is the routine maintenance that keeps the alarm
#     quiet. Its pull requests run the two required checks like any other, and the frontend
#     build needs no secrets (lib/supabase/client.ts falls back to a placeholder at build time).
#
# Times are IST (Asia/Kolkata), the firm's clock; Dependabot evaluates `time` in `timezone`.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "supabase"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sentry/nextjs"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/apps/marketing"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    groups:
      marketing-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
